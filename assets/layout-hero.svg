<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">termcolor-layout display-width and layout gallery</title>
  <desc id="desc">A dark terminal showing Unicode width, wrapping, columns, and Unicode and ASCII boxes.</desc>
  <rect width="1200" height="620" rx="20" fill="#1e1e2e"/>
  <rect width="1200" height="58" rx="20" fill="#292b3b"/><rect y="38" width="1200" height="20" fill="#292b3b"/>
  <circle cx="32" cy="29" r="8" fill="#f38ba8"/><circle cx="58" cy="29" r="8" fill="#f9e2af"/><circle cx="84" cy="29" r="8" fill="#a6e3a1"/>
  <text x="116" y="36" fill="#cba6f7" font-family="SFMono-Regular,Menlo,monospace" font-size="20" font-weight="700">termcolor-layout · display cells, not bytes</text>
  <text x="48" y="100" fill="#cdd6f4" font-family="SFMono-Regular,Menlo,monospace" font-size="28" font-weight="700">Unicode-aware layout for styled Text</text>
  <text x="48" y="132" fill="#a6adc8" font-family="SFMono-Regular,Menlo,monospace" font-size="17">width, wrap, columns, and boxes stay pure until the caller renders</text>
  <rect x="40" y="158" width="530" height="410" rx="16" fill="#181825" stroke="#45475a" stroke-width="2"/>
  <rect x="590" y="158" width="570" height="410" rx="16" fill="#181825" stroke="#45475a" stroke-width="2"/>
  <text x="70" y="202" fill="#cba6f7" font-family="SFMono-Regular,Menlo,monospace" font-size="18" font-weight="700">DISPLAY WIDTH</text>
  <text x="70" y="244" fill="#a6adc8" font-family="SFMono-Regular,Menlo,monospace" font-size="18">ASCII       termcolor   width=9</text>
  <text x="70" y="278" fill="#89b4fa" font-family="SFMono-Regular,Menlo,monospace" font-size="18">CJK         界面        width=4</text>
  <text x="70" y="312" fill="#f9e2af" font-family="SFMono-Regular,Menlo,monospace" font-size="18">combining   é          width=1</text>
  <text x="70" y="346" fill="#94e2d5" font-family="SFMono-Regular,Menlo,monospace" font-size="18">tab stops   a   界      width=6</text>
  <text x="70" y="390" fill="#cba6f7" font-family="SFMono-Regular,Menlo,monospace" font-size="18" font-weight="700">ALIGNMENT</text>
  <text x="70" y="428" fill="#a6e3a1" font-family="SFMono-Regular,Menlo,monospace" font-size="18">left    │ left</text>
  <text x="70" y="462" fill="#f9e2af" font-family="SFMono-Regular,Menlo,monospace" font-size="18">center  │      center</text>
  <text x="70" y="496" fill="#94e2d5" font-family="SFMono-Regular,Menlo,monospace" font-size="18">right   │             right</text>
  <text x="70" y="542" fill="#6c7086" font-family="SFMono-Regular,Menlo,monospace" font-size="15">CJK and combining marks keep their cells</text>
  <text x="620" y="202" fill="#cba6f7" font-family="SFMono-Regular,Menlo,monospace" font-size="18" font-weight="700">COLUMNS + BOXES</text>
  <text x="620" y="242" fill="#cdd6f4" font-family="SFMono-Regular,Menlo,monospace" font-size="17">feature       what it preserves      width</text>
  <text x="620" y="274" fill="#94e2d5" font-family="SFMono-Regular,Menlo,monospace" font-size="17">wrap          styled content          24</text>
  <text x="620" y="306" fill="#94e2d5" font-family="SFMono-Regular,Menlo,monospace" font-size="17">columns       aligned cells           36</text>
  <text x="620" y="338" fill="#94e2d5" font-family="SFMono-Regular,Menlo,monospace" font-size="17">box           title + padding         30</text>
  <rect x="620" y="374" width="220" height="126" fill="none" stroke="#6c7086" stroke-width="2"/>
  <text x="640" y="366" fill="#cba6f7" font-family="SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700">┌─ default box ─┐</text>
  <text x="640" y="414" fill="#a6e3a1" font-family="SFMono-Regular,Menlo,monospace" font-size="17">│ Unicode borders │</text>
  <text x="640" y="446" fill="#a6e3a1" font-family="SFMono-Regular,Menlo,monospace" font-size="17">│ wraps in width  │</text>
  <text x="640" y="478" fill="#a6e3a1" font-family="SFMono-Regular,Menlo,monospace" font-size="17">└─────────────────┘</text>
  <text x="890" y="366" fill="#cba6f7" font-family="SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700">+─ ASCII fallback ─+</text>
  <text x="890" y="414" fill="#f9e2af" font-family="SFMono-Regular,Menlo,monospace" font-size="17">| safe on old TTYs |</text>
  <text x="890" y="446" fill="#f9e2af" font-family="SFMono-Regular,Menlo,monospace" font-size="17">+-----------------+</text>
  <text x="620" y="542" fill="#6c7086" font-family="SFMono-Regular,Menlo,monospace" font-size="15">styles and OSC-8 metadata survive layout transforms</text>
</svg>
